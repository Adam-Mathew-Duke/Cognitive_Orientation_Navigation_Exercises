<!-- index.html -->

<!DOCTYPE html>
<html>
    <head>

        <!-- Ignore the favicon request -->
        <link rel="icon" href="data:,">

        <!-- Load css files -->
        <link rel="stylesheet" href="css/main.css">
        <link rel="stylesheet" href="css/canvas_course.css">
        <link rel="stylesheet" href="css/toolbar_main.css">
        <link rel="stylesheet" href="css/pico/pico.min.css">
        <link rel="manifest" href="json/manifest.json">
    </head>
    <body>

        <!-- Course canvas -->
        <div class="course-class" id="course-id">
            <canvas id="courseCanvas" resize="true"></canvas>
        </div>

            <!-- Main toolbar -->
            <div class ="toolbar-main-class" id="toolbar-main-id">
                <button id="toolbar-main-btn-cone">CONES</button>
                <button id="toolbar-main-btn-path">PATHS</button>
                <button id="toolbar-main-btn-note">NOTES</button>
                <button id="toolbar-main-zoom-in-btn">ZOOM IN</button>
                <button id="toolbar-main-zoom-out-btn">ZOOM OUT</button>
                <button id="toolbar-main-zoom-default-btn">ZOOM DEFAULT</button>
                <button disabled id="toolbar-main-redo-btn">REDO</button>
                <button id="toolbar-main-undo-btn">UNDO</button>
                <button id="toolbar-main-clear-btn">CLEAR</button>
                <button id="toolbar-main-save-btn">SAVE</button>       
            </div>

        <!-- Load scripts -->
        <script type="text/javascript" src="js/paper/paper-full.js"></script>
        <script type="module" src="js/main.js"></script>
    </body>
</html>
