<!DOCTYPE html>
<html>
    <head>
        <!-- CSS -->
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/pico.min.css">
    </head>
    <body>
        <!-- Drawing -->
        <div class="drawing-class" id="drawing-id">
            <canvas id="myCanvas" resize="true"></canvas>
        </div>
        <!-- Tools -->
        <div class="tool-class" id="tool-id">
            <button id="zoom-in-btn">+</button>
            <button id="zoom-out-btn">-</button>
            <button id="btn-cone">Cone</button>
            <button id="btn-path">Path</button>
            <button id="btn-note">Note</button>
            <button id="undo-btn">Undo</button>
            <button id="clear-btn">Clear</button>
            <button disabled id="save-btn">Save</button>
        </div>
        <!-- Javascript -->
        <script type="text/javascript" src="js/paper-full.js"></script>
        <script type="text/paperscript" src="js/main.js" canvas="myCanvas"></script>
    </body>
</html>
