<!DOCTYPE html>
<html>
    <head>
        <link rel="icon" href="data:,">
        <link rel="stylesheet" href="css/main.css">
        <link rel="stylesheet" href="css/canvas_course.css">
        <link rel="stylesheet" href="css/toolbar_main.css">
        <link rel="stylesheet" href="css/toolbar_objects.css">
        <link rel="stylesheet" href="css/toolbar_zoom.css">  
        <link rel="stylesheet" href="css/toolbar_history.css">
        <link rel="stylesheet" href="css/tooltip.css">      
        <link rel="stylesheet" href="css/pico/pico.min.css">
        <link rel="manifest" href="json/manifest.json">
    </head>
    <body>

    <!-- Tool tips -->
    <div class="tooltip-container-class" id="tooltip-container-id" style="display: flex; align-items: center; gap: 8px;">
        <div class="tooltip-item-class">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink: 0;">
                <path d="M4 4V16C4 17.1046 4.89543 18 6 18H18" stroke="#e20cb7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M4 11H15" stroke="#e20cb7" stroke-width="2" stroke-linecap="round"/>
                <circle cx="8" cy="21" r="2" stroke="#e20cb7" stroke-width="2"/>
                <circle cx="16" cy="21" r="2" stroke="#e20cb7" stroke-width="2"/>
                <path d="M10 21H14" stroke="#e20cb7" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span id="tooltip_item-id">Add a cone, path or note.</span>
        </div>
    </div>

    <!-- Course canvas -->
    <div class="course-class" id="course-id">
        <canvas id="courseCanvas" resize="true"></canvas>
    </div>

    <!-- Toolbar absolute positioning to help with CSS trans -->
    <div class="toolbar-container-wrapper">

        <!-- Main toolbar -->
        <div class="toolbar-main-class" id="toolbar-main-id">

            <!-- Objects toolbar toggle button -->
            <button id="objects-toolbar-toggle-btn" class="toolbar-btn" title="Objects Toolbar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="#ff04fb59" stroke-width="2" fill="#ff04fb" fill-opacity="1"/>
                    <circle cx="12" cy="12" r="4.5" fill="#e20cb7" stroke="#ffffff" stroke-width="1.5"/>
                </svg>
                <span>Objects</span>
            </button>

            <!-- Add Path button -->
            <button id="toolbar-main-btn-path" class="toolbar-btn" title="Draw Path">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 16C8 16 9 8 14 10C19 12 18 20 20 20" stroke="#ff04fb59" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M4 16C8 16 9 8 14 10C19 12 18 20 20 20" stroke="#e20cb7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Path</span>
            </button>

            <!-- Add Note button -->
            <button id="toolbar-main-btn-note" class="toolbar-btn" title="Add Note">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="5" y="3" width="14" height="18" rx="2" stroke="#ff04fb59" stroke-width="2" fill="#ff04fb" fill-opacity="0.15"/>
                    <line x1="8" y1="8" x2="16" y2="8" stroke="#e20cb7" stroke-width="2" stroke-linecap="round"/>
                    <line x1="8" y1="12" x2="16" y2="12" stroke="#e20cb7" stroke-width="2" stroke-linecap="round"/>
                    <line x1="8" y1="16" x2="12" y2="16" stroke="#e20cb7" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>Note</span>
            </button>

            <!-- Zoom toolbar toggle button -->
            <button id="zoom-toolbar-toggle-btn" class="toolbar-btn" title="Zoom Toolbar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="10.5" cy="10.5" r="7.5" stroke="#e20cb7" stroke-width="2"/>
                    <line x1="16" y1="16" x2="22" y2="22" stroke="#e20cb7" stroke-width="2" stroke-linecap="round"/>
                    <line x1="10.5" y1="7.5" x2="10.5" y2="13.5" stroke="#e20cb7" stroke-width="2" stroke-linecap="round"/>
                    <line x1="7.5" y1="10.5" x2="13.5" y2="10.5" stroke="#e20cb7" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>Zoom</span>
            </button>

            <!-- History toolbar toggle button -->
            <button id="history-toolbar-toggle-btn" class="toolbar-btn" title="History Toolbar">
                <svg width="30" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 5H17C18.6569 5 20 6.34315 20 8V16C20 17.6569 18.6569 19 17 19H7C5.34315 19 4 17.6569 4 16V8C4 6.34315 5.34315 5 7 5H9" stroke="#e20cb7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
                    <path d="M16 9L19 5L22 9" stroke="#e20cb7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
                </svg>
                <span>History</span>
            </button>

            <!-- Clear Course button -->
            <button id="toolbar-main-clear-btn" class="toolbar-btn" title="Clear All">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 6h18" stroke="#e20cb7" stroke-width="2" stroke-linecap="round"/>
                    <path d="M8 6V4h8v2" stroke="#e20cb7" stroke-width="2" stroke-linecap="round"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0v12h8V6" stroke="#e20cb7" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>Clear</span>
            </button>

            <!-- Save URL button -->
            <button id="toolbar-main-save-btn" class="toolbar-btn" title="Copy URL State">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <polyline points="16 18 22 12 16 6" stroke="#e20cb7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <polyline points="8 6 2 12 8 18" stroke="#e20cb7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <line x1="14" y1="4" x2="10" y2="20" stroke="#e20cb7" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>Save</span>
            </button>
        </div>

        <!-- Objects toolbar -->
        <div class="toolbar-main-class objectstoolbar-hidden" id="objectstoolbar-main-id">
         
            <!-- CONE -->
            <button id="toolbar-main-btn-cone" class="toolbar-btn" title="Add Cone">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="#ff04fb59" stroke-width="2" fill="#ff04fb" fill-opacity="1"/>
                    <circle cx="12" cy="12" r="4.5" fill="#e20cb7" stroke="#ffffff" stroke-width="1.5"/>
                </svg>
                <span>Cone</span>
            </button>

            <!-- SHOE -->
            <button id="toolbar-main-btn-shoe" class="toolbar-btn" title="Add Shoe">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 15.5C2 15.5 3 11 6 9.5C9 8 11.5 8 13.5 9.5C15.5 11 17.5 10 19.5 8.5C21.5 7 22 9 22 10.5C22 12 21 13.5 20 14.5C19 15.5 17 15.5 15 15.5H2V15.5Z" stroke="#ff04fb59" stroke-width="2" stroke-linejoin="round" fill="#ff04fb" fill-opacity="1"/>
            <path d="M2 16.5H21C21.8 16.5 22 17.2 22 18C22 18.8 21.8 19.5 21 19.5H2C1.2 19.5 1 18.8 1 18C1 17.2 1.2 16.5 2 16.5Z" fill="#e20cb7" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
            <span>Shoe</span>
            </button>

            <!-- WATER BOTTLE -->
             <button id="toolbar-main-btn-bottle" class="toolbar-btn" title="Add Water Bottle">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Cap -->
                    <path d="M10 2H14V5H10V2Z" fill="#e20cb7" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
                    <!-- Neck -->
                    <path d="M11 5H13V7H11V5Z" fill="#ff04fb" fill-opacity="1" stroke="#ff04fb59" stroke-width="1"/>
                    <!-- Body -->
                    <path d="M7 7H17C18.1 7 19 7.9 19 9V20C19 21.1 18.1 22 17 22H7C5.9 22 5 21.1 5 9V9C5 7.9 5.9 7 7 7Z" stroke="#ff04fb59" stroke-width="2" stroke-linejoin="round" fill="#ff04fb" fill-opacity="0.22"/>
                    <!-- Bottle Label/Highlight Stripe -->
                    <path d="M7 11H17V17H7V11Z" fill="#e20cb7" fill-opacity="0.6"/>
                </svg>
                <span>Bottle</span>
            </button>

            <!-- SOCK -->
             <button id="toolbar-main-btn-sock" class="toolbar-btn" title="Add Sock">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Sock Body / Foot -->
                    <path d="M6 4H10V14H18V18H6V4Z" stroke="#ff04fb59" stroke-width="2" stroke-linejoin="round" fill="#ff04fb" fill-opacity="0.22"/>
                    <!-- Cuff Stripe -->
                    <path d="M6 4H10V8H6V4Z" fill="#e20cb7" fill-opacity="0.6"/>
                    <!-- Heel/Toe Accent -->
                    <path d="M14 14H18V18H14V14Z" fill="#e20cb7"/>
                </svg>
                <span>Sock</span>
            </button>

            <!-- BEAN BAG -->
            <button id="toolbar-main-btn-beanbag" class="toolbar-btn" title="Add Bean Bag">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="12" cy="12" rx="9" ry="6" fill="#ff04fb" fill-opacity="0.4" stroke="#e20cb7" stroke-width="2"/>
                </svg>
                <span>Bean Bag</span>
            </button>

            <!-- TRAFFIC CONE -->
            <button id="toolbar-main-btn-trafficcone" class="toolbar-btn" title="Add Traffic Cone">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 18H20V20H4V18Z" fill="#e20cb7"/>
                    <path d="M12 4L6 18H18L12 4Z" fill="#ff04fb" stroke="#e20cb7" stroke-width="1.5"/>
                    <path d="M9 11H15V13H9V11Z" fill="#ffffff"/>
                </svg>
                <span>T. Cone</span>
            </button>

            <!-- CAP -->
            <button id="toolbar-main-btn-cap" class="toolbar-btn" title="Add Baseball Cap">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="11" r="7" fill="#ff04fb" stroke="#e20cb7" stroke-width="1.5"/>
                    <path d="M5 14C5 14 8 18 16 16" stroke="#e20cb7" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>Cap</span>
            </button>

            <!-- STICK -->
            <button id="toolbar-main-btn-stick" class="toolbar-btn" title="Add Stick">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <line x1="4" y1="20" x2="20" y2="4" stroke="#e20cb7" stroke-width="3" stroke-linecap="round"/>
                </svg>
                <span>Stick</span>
            </button>

            <!-- ROCK -->
            <button id="toolbar-main-btn-rock" class="toolbar-btn" title="Add Rock">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5 16L7 9L13 6L19 11L17 19H5Z" fill="#e20cb7" stroke="#ff04fb" stroke-width="1.5" stroke-linejoin="round"/>
                </svg>
                <span>Rock</span>
            </button>

            <!-- HELMET -->
            <button id="toolbar-main-btn-helmet" class="toolbar-btn" title="Add Helmet">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="8" fill="#ff04fb" stroke="#e20cb7" stroke-width="2"/>
                    <rect x="7" y="13" width="10" height="4" fill="#e20cb7"/>
                </svg>
                <span>Helmet</span>
            </button>

            <!-- RETURN -->
            <button class="zoomtoolbar-btn" title="Return" id="objects-toolbar-return-btn">
                <svg width="30" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 19L5 15L9 11" stroke="#e20cb7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M5 15H15C17.7614 15 20 12.7614 20 10V9" stroke="#e20cb7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Return</span>
            </button>
        </div>

        <!-- Zoom toolbar -->
        <div class="toolbar-main-class zoomtoolbar-hidden" id="zoomtoolbar-main-id">
            <button id="toolbar-main-zoom-in-btn" class="zoomtoolbar-btn" title="Zoom In">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="10.5" cy="10.5" r="7.5" stroke="#e20cb7" stroke-width="2"/>
                    <line x1="16" y1="16" x2="22" y2="22" stroke="#e20cb7" stroke-width="2" stroke-linecap="round"/>
                    <line x1="10.5" y1="7.5" x2="10.5" y2="13.5" stroke="#e20cb7" stroke-width="2" stroke-linecap="round"/>
                    <line x1="7.5" y1="10.5" x2="13.5" y2="10.5" stroke="#e20cb7" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>Zoom In</span>
            </button>
            <button id="toolbar-main-zoom-out-btn" class="zoomtoolbar-btn" title="Zoom Out">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="10.5" cy="10.5" r="7.5" stroke="#e20cb7" stroke-width="2"/>
                    <line x1="16" y1="16" x2="22" y2="22" stroke="#e20cb7" stroke-width="2" stroke-linecap="round"/>
                    <line x1="7.5" y1="10.5" x2="13.5" y2="10.5" stroke="#e20cb7" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>Zoom Out</span>
            </button>
            <button id="toolbar-main-zoom-default-btn" class="zoomtoolbar-btn" title="Reset Zoom">
                <svg width="25" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="3" stroke="#e20cb7" stroke-width="2"/>
                    <circle cx="12" cy="12" r="9" stroke="#e20cb7" stroke-width="2" stroke-dasharray="3 3"/>
                    <path d="M12 3V1" stroke="#e20cb7" stroke-width="2" stroke-linecap="round"/>
                    <path d="M12 21V19" stroke="#e20cb7" stroke-width="2" stroke-linecap="round"/>
                    <path d="M3 12H1" stroke="#e20cb7" stroke-width="2" stroke-linecap="round"/>
                    <path d="M21 12H19" stroke="#e20cb7" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>Reset Zoom</span>
            </button>
            <button id="toolbar-main-pan-btn" class="zoomtoolbar-btn" title="Pan Mode" aria-pressed="false">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 11V6C18 4.89543 17.1046 4 16 4C14.8954 4 14 4.89543 14 6V11" stroke="#e20cb7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M14 9.5V5C14 3.89543 13.1046 3 12 3C10.8954 3 10 3.89543 10 5V11.5" stroke="#e20cb7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M10 10.5V7C10 5.89543 9.10457 5 8 5C6.89543 5 6 5.89543 6 7V13.5C6 16.5376 8.46243 19 11.5 19H12.5C15.5376 19 18 16.5376 18 13.5V13" stroke="#e20cb7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Pan</span>
            </button>
            <button class="zoomtoolbar-btn" title="Return" id="zoom-toolbar-return-btn">
                <svg width="30" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 19L5 15L9 11" stroke="#e20cb7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M5 15H15C17.7614 15 20 12.7614 20 10V9" stroke="#e20cb7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Return</span>
            </button>
        </div>

        <!-- History toolbar -->
        <div class="toolbar-main-class historytoolbar-hidden" id="historytoolbar-main-id">
            <button id="toolbar-main-redo-btn" class="historytoolbar-btn" title="Redo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 5H17C18.6569 5 20 6.34315 20 8V16C20 17.6569 18.6569 19 17 19H7C5.34315 19 4 17.6569 4 16V8C4 6.34315 5.34315 5 7 5H9" stroke="#e20cb7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
                    <path d="M16 9L19 5L22 9" stroke="#e20cb7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
                </svg>
                <span>Redo Action</span>
            </button>
            <button id="toolbar-main-undo-btn" class="historytoolbar-btn" title="Undo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 5H7C5.34315 5 4 6.34315 4 8V16C4 17.6569 5.34315 19 7 19H17C18.6569 19 20 17.6569 20 16V8C20 6.34315 18.6569 5 17 5H15" stroke="#e20cb7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M8 9L5 5L2 9" stroke="#e20cb7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Undo Action</span>
            </button>
            <button class="historytoolbar-btn" title="Return" id="history-toolbar-return-btn">
                <svg width="30" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 19L5 15L9 11" stroke="#e20cb7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M5 15H15C17.7614 15 20 12.7614 20 10V9" stroke="#e20cb7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Return</span>
            </button>
        </div>
    </div>

        <script type="text/javascript" src="js/paper/paper-full.js"></script>
        <script type="module" src="js/main.js"></script>
    </body>
</html>
