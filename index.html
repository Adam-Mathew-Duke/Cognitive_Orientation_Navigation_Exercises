<!doctype html>
<html lang="en">

    <!-- HEAD -->
    <head>
        <meta charset="UTF-8">
        <link rel="shortcut icon" href="#">
        <link rel="stylesheet" href="style.css"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inline Skating Cone Project</title>
    </head>

    <!-- BODY -->
    <body>

        <!-- MAIN MENU BACKDROP -->
        <div class="modal-backdrop" id="menu-backdrop">

            <!-- MAIN MENU -->
            <div class="main-menu-container">

                <!-- MAIN MENU CONTENTS -->
                <div><button class="button-main-menu" id="add-cone">Add Cone</button></div>
                <div><button class="button-main-menu" id="add-path">Add Path</button></div>
                <div><button class="button-main-menu">Course Notes</button></div>
                <div><button class="button-main-menu">Save Course</button></div>
                <div><button class="button-main-menu" id="clear-course">Clear Course</button></div>
                <div><button class="button-main-menu" id="close-menu-btn">Close Menu</button></div>
            </div>
        </div>

<!-- COURSE SECTION -->
    <div class="course-container">
        <svg id="course-svg" viewBox="0 0 40 80" xmlns="http://www.w3.org/2000/svg">
            <!-- Container to hold multiple independent paths (placed before cones so lines stay underneath) -->
            <g id="paths-container"></g>
            
            <!-- Initial Cone -->
            <g class="draggable-cone" transform="translate(10, 30)">
                <circle cx="10" cy="10" r="4" fill="rgba(0,0,0,0.1)"/>
                <circle cx="10" cy="10" r="2" fill="yellow"/>
            </g>
        </svg>
    </div>

        <!-- MAIN MENU SECTION -->
        <div class="center-tools">
            <div class="tool-container">
                <div>
                    <button class="button" id="open-menu-btn">Menu</button>
                </div>
            </div>
        </div>

        <!-- MAIN JS -->
        <script src="main.js"></script>
    </body>
</html>
