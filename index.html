<!--
Name: Cone Navigation 
Version: Prototype
Description: Mobile first skating and layout testing
-->

<!-- HTML -->
<!doctype html>
<html lang="en">

    <!-- HEAD -->
    <head>
        <meta charset="UTF-8">
        <link rel="shortcut icon" href="#">
        <link rel="stylesheet" href="style.css"> 
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Inline Skating Cone Project</title>
    </head>

    <!-- BODY -->
    <body>

        <!-- MAIN MENU BACKDROP -->
        <div class="modal-backdrop" id="menu-backdrop">

            <!-- MAIN MENU -->
            <div class="main-menu-container">

                <!-- MAIN MENU CONTENTS -->
                <div><button class="button-main-menu">cone</button></div>
                <div><button class="button-main-menu">path</button></div>
                <div><button class="button-main-menu">symbol</button></div>
                <div><button class="button-main-menu">note</button></div>
                <div><button class="button-main-menu">save</button></div>
                <div><button class="button-main-menu">clear</button></div>
                <div><button class="button-main-menu" id="close-menu-btn">close</button></div>
            </div>
        </div>
        <!-- COURSE SECTION -->
        <div class="course-container">
            <!-- DRAGGABLE CONE -->
            <svg viewBox="0 0 40 80" xmlns="http://www.w3.org/2000/svg">
                <circle id="draggable-cone" cx="10" cy="10" r="3" fill="green"/>
            </svg>
        </div>
        <!-- MAIN MENU SECTION -->
        <div class="center-tools">
            <div class="tool-container">
            <div>
                <button class="button" id="open-menu-btn">MENU</button>
            </div>
        </div>
        <!-- MAIN JS -->
        <script src="main.js"></script>
    </body>
</html>
<!-- END OF CODE -->
